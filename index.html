        function syncSettlementsWithProjects() {
            // 去重：确保一个项目只对应一条结算记录（与数据库唯一约束一致，避免重复数据累积）
            // 优先保留手动编辑过(_manual)的记录
            const _byPid = {};
            appData.settlements = appData.settlements.filter(s => {
                if (!s.projectId) return true;
                const prev = _byPid[s.projectId];
                if (prev) {
                    if (s._manual && !prev._manual) _byPid[s.projectId] = s;
                    return false;
                }
                _byPid[s.projectId] = s;
                return true;
            });
            // 【v21.19 修复】按 id 主键再去重一次：旧版 getNextId 未扫描归档数组时可能生成
            // 与归档项目 id 撞车的 settlement id，导致云端 settlements_pkey 冲突、上传整批失败。
            // _manual=true 优先，否则保留先出现的那条。
            const _bySid = {};
            appData.settlements = appData.settlements.filter(s => {
                if (!s.id) return true;
                const prev = _bySid[s.id];
                if (!prev) { _bySid[s.id] = s; return true; }
                if (s._manual && !prev._manual) { _bySid[s.id] = s; return true; }
                console.warn('⚠️ 本地 settlements 重复 id 去重:', s.id);
                return false;
            });
            // 【v21.16 审计修复】原只覆盖 active+archived，导致搁置/终止项目的结算记录被
            // 下方 validIds 过滤掉（同步时本地丢失）。改为覆盖全部四种状态，与归档保持一致，
            // 避免结算/提成数据因项目状态变更而意外消失。
            const activeAndArchived = [
                ...appData.projects.map(p => ({ ...p, _status: 'active' })),
                ...appData.archived.map(a => ({ ...a.projectData, _status: 'archived' })),
                ...appData.shelved.map(s => ({ ...s.projectData, _status: 'shelved' })),
                ...appData.terminated.map(t => ({ ...t.projectData, _status: 'terminated' }))
            ];

            activeAndArchived.forEach(p => {
                const existing = appData.settlements.find(s => s.projectId === p.id);
                const tpl = appData.templates.find(t => t.id === p.templateId);
                const tag = p.tag || '';
                let cfg = null;
                if (appData.commissionTemplates) {
                    const key1 = `${tpl?.name}||${tag}`;
                    const key2 = `${tpl?.name}||`;
                    cfg = appData.commissionTemplates[key1] || appData.commissionTemplates[key2] || null;
                }
                if (!cfg) cfg = (tpl?.settlementByTag || {})[tag] || { total: 0, ratios: [] };
                const isDone = calcStatus(p.nodes) === 'done';

                if (!existing) {
                    appData.settlements.push({
                        id: getNextId(),
                        projectId: p.id,
                        company: p.company,
                        projectName: getTplName(p.templateId),
                        tag: tag,
                        doneDate: isDone ? (p.doneDate || new Date().toISOString().split('T')[0]) : '',
                        totalCommission: cfg.total || 0,
                        settledAmount: 0,
                        installments: (cfg.ratios || []).map(r => ({
                            ratio: r,
                            amount: Math.round((cfg.total || 0) * r / 100 * 100) / 100,
                            paid: false,
                            paidDateMonth: '',
                            paidDate: ''
                        })),
                        note: '',
                        fullySettled: false,
                        _manual: false
                    });
                } else {
                    if (existing._manual) {
                        existing.company = p.company;
                        existing.projectName = getTplName(p.templateId);
                        existing.tag = tag;
                        if (isDone && !existing.doneDate) existing.doneDate = p.doneDate || new Date().toISOString()
                            .split('T')[0];
                        if (!isDone) existing.doneDate = '';
                        existing.settledAmount = existing.installments.filter(inst => inst.paid).reduce((a, b) => a +
                            b.amount, 0);
                        const activeInstalls = existing.installments.filter(inst => inst.ratio > 0);
                        existing.fullySettled = activeInstalls.length > 0 && activeInstalls.every(inst => inst.paid);
                    } else {
                        const oldInstallments = existing.installments || [];
                        const newTotal = cfg.total || 0;
                        const newRatios = cfg.ratios || [];

                        if (newRatios.length !== oldInstallments.length) {
                            const newInstallments = newRatios.map((ratio, idx) => {
                                const oldInst = oldInstallments[idx] || {};
                                return {
                                    ratio: ratio,
                                    amount: Math.round(newTotal * ratio / 100 * 100) / 100,
                                    paid: oldInst.paid || false,
                                    paidDateMonth: oldInst.paidDateMonth || '',
                                    paidDate: oldInst.paidDate || ''
                                };
                            });
                            existing.installments = newInstallments;
                        } else {
                            existing.installments = (existing.installments || []).map((inst, idx) => ({
                                ...inst,
                                ratio: newRatios[idx] || 0,
                                amount: Math.round(newTotal * (newRatios[idx] || 0) / 100 * 100) / 100
                            }));
                        }
                        existing.totalCommission = newTotal;
                        existing.tag = tag;
                        existing.company = p.company;
                        existing.projectName = getTplName(p.templateId);
                        if (isDone && !existing.doneDate) existing.doneDate = p.doneDate || new Date().toISOString()
                            .split('T')[0];
                        if (!isDone) existing.doneDate = '';
                        existing.settledAmount = existing.installments.filter(inst => inst.paid).reduce((a, b) => a +
                            b.amount, 0);
                        const activeInstalls = existing.installments.filter(inst => inst.ratio > 0);
                        existing.fullySettled = activeInstalls.length > 0 && activeInstalls.every(inst => inst.paid);
                        existing._manual = false;
                    }
                }
            });

            const validIds = new Set(activeAndArchived.map(p => p.id));
            appData.settlements = appData.settlements.filter(s => validIds.has(s.projectId));
            saveData();
        }

        function collectAllProjectIds() {
            const ids = [];
            (appData.projects || []).forEach(p => { if (p && p.id) ids.push(p.id); });
            (appData.archived || []).forEach(a => { if (a && a.projectData && a.projectData.id) ids.push(a.projectData.id); });
            (appData.shelved || []).forEach(s => { if (s && s.projectData && s.projectData.id) ids.push(s.projectData.id); });
            (appData.terminated || []).forEach(t => { if (t && t.projectData && t.projectData.id) ids.push(t.projectData.id); });
            return new Set(ids);
        }

        function checkPostPullProjectLoss(preIds, backupJson) {
            try {
                if (!preIds || preIds.size === 0) return;
                const postIds = collectAllProjectIds();
                const lost = [...preIds].filter(id => !postIds.has(id));
                if (lost.length === 0) return;
                console.warn('⚠️【v2防护】本次云端同步后，有 ' + lost.length + ' 个本地项目在云端不存在（可能曾被误删）:', lost);
                if (backupJson) { try { localStorage.setItem('workbench_prepull_backup', backupJson); } catch (e) {} }
                showProjectLossWarning(lost.length);
            } catch (e) {
                console.warn('⚠️ 项目缺失检测异常:', e);
            }
        }

        function startAutoSync() {

  	             // 本地有待上传的修改（例如刚改了节点状态）时，先上传再拉取，
  	             // 否则 30s 拉取会把云端旧数据覆盖回来，导致刚做的修改丢失
  	             const hadPending = _pendingUpload;
  	             if (_pendingUpload) {
    	                 try {
    	                     console.log('⏰ 自动同步：检测到本地未上传修改，先上传再拉取...');

  	             if (autoUploadTimer) {

    	                 return;
    	             }
     	            if (hadPending) {
     	                 // 已上传并从云端刷新过数据，直接渲染最新状态（无需重复拉取）
     	                 const ae = document.activeElement;
      	                 const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' ||
      	                     ae.tagName === 'SELECT' || ae.isContentEditable);

     	            } else {

      	                      const ae = document.activeElement;
      	                      const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' ||
      	                          ae.tagName === 'SELECT' || ae.isContentEditable);

        	                      updateSyncStatus('已同步', 'success');
        	                  }
        	              console.log('✅ 自动拉取完成');
    	                  } catch (e) {
     	                      console.warn('⚠️ 自动拉取失败:', e);
    	                  }
     	            }
 	       }, 30000);
        }

        function stopAutoSync() {

        // ============================================================

        function createModal(htmlContent, onClose) {
            document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = htmlContent;
            document.body.appendChild(overlay);
            const closeBtn = overlay.querySelector('.close-btn');
            if (closeBtn) {
                closeBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    overlay.remove();
                    if (onClose) onClose();
                });
            }
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    overlay.remove();
                    if (onClose) onClose();
                }
            });
            return overlay;
        }

        function closeModal() {
            document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
        }

        function showConfirm(message, onConfirm, onCancel) {
            const html =
                `<div class="modal" style="max-width:440px;"><button class="close-btn" style="position:absolute;top:12px;right:16px;font-size:22px;cursor:pointer;color:#94a3b8;background:none;border:none;">✕</button><h3 style="font-size:16px;margin-bottom:12px;">⚠️ 确认</h3><p style="font-size:15px;color:var(--text);margin-bottom:20px;white-space:pre-wrap;">${esc(message)}</p><div class="confirm-actions"><button class="btn btn-ghost" id="confirmCancelBtn">取消</button><button class="btn btn-primary" id="confirmOkBtn">确认</button></div></div>`;
            const overlay = createModal(html, function() { if (onCancel) onCancel(); });
            overlay.querySelector('#confirmOkBtn').addEventListener('click', function() { overlay.remove(); if (onConfirm)
                    onConfirm(); });
            overlay.querySelector('#confirmCancelBtn').addEventListener('click', function() { overlay.remove(); if (
                    onCancel) onCancel(); });
            return overlay;
        }

        function showAlert(message, callback) {
            const html =
                `<div class="modal" style="max-width:440px;"><button class="close-btn" style="position:absolute;top:12px;right:16px;font-size:22px;cursor:pointer;color:#94a3b8;background:none;border:none;">✕</button><h3 style="font-size:16px;margin-bottom:12px;">ℹ️ 提示</h3><p style="font-size:15px;color:var(--text);margin-bottom:20px;white-space:pre-wrap;">${esc(message)}</p><div class="confirm-actions"><button class="btn btn-primary" id="alertOkBtn">确定</button></div></div>`;
            const overlay = createModal(html, function() { if (callback) callback(); });
            overlay.querySelector('#alertOkBtn').addEventListener('click', function() { overlay.remove(); if (callback)
                    callback(); });
            return overlay;
        }

        function showPrompt(message, defaultValue, onConfirm, onCancel) {
            const html =
                `<div class="modal" style="max-width:440px;"><button class="close-btn" style="position:absolute;top:12px;right:16px;font-size:22px;cursor:pointer;color:#94a3b8;background:none;border:none;">✕</button><h3 style="font-size:16px;margin-bottom:12px;">✏️ 输入</h3><p style="font-size:14px;color:var(--text-secondary);margin-bottom:8px;">${esc(message)}</p><input id="promptInput" type="text" value="${esc(defaultValue||'')}" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid #e2e8f0;font-size:14px;margin-bottom:16px;"><div class="confirm-actions"><button class="btn btn-ghost" id="promptCancelBtn">取消</button><button class="btn btn-primary" id="promptOkBtn">确定</button></div></div>`;
            const overlay = createModal(html, function() { if (onCancel) onCancel(); });
            const input = overlay.querySelector('#promptInput');
            overlay.querySelector('#promptOkBtn').addEventListener('click', function() { const val = input.value;
                overlay.remove(); if (onConfirm) onConfirm(val); });
            overlay.querySelector('#promptCancelBtn').addEventListener('click', function() { overlay.remove(); if (
                    onCancel) onCancel(); });
            input.addEventListener('keydown', function(e) { if (e.key === 'Enter') overlay.querySelector('#promptOkBtn')
                    .click(); });
            setTimeout(() => input.focus(), 100);
            return overlay;
        }

        // ============================================================

function renderHome(mc) {

        // 逻辑：列出未完成任务中 —— ①逾期(due<today)、②今日(due=today)、③明日(due=tomorrow)
        // 排序：逾期→今日→明日→其他未设置日期的
        // 上限：最多展示 6 条，超出显示 "+N 更多"
        // 点击勾选框：切换 completed=true 并触发 saveData() 自动上传
        // 点击任务标题：跳转到任务分配页
        const _todayISO = new Date().toISOString().split('T')[0];
        const _tomorrowISO = (() => { const d = new Date(); d.setDate(d.getDate() + 1); return d.toISOString().split('T')[0]; })();
        const _unfinishedTasks = (appData.tasks || []).filter(t => !t.completed);
        // 【v21.18 修复】原 _moreCount 只算"有日期任务"超出 6 条的部分，把"无日期任务"吞了。

                let prio = 3, tag = '';

                else if (dd === _todayISO) { prio = 1; tag = 'today'; }
                else if (dd === _tomorrowISO) { prio = 2; tag = 'tomorrow'; }
                return { ...t, _prio: prio, _tag: tag };
            })
            .filter(t => t._prio <= 2 || !t.dueDate)  // 只保留 逾期/今日/明日/无日期
            .sort((a, b) => (a._prio - b._prio) || (a.dueDate || 'zz').localeCompare(b.dueDate || 'zz'));
        const _todayList = _todayCandidates.slice(0, 6);

        function toggleKanbanCol(colKey) {

        function kanbanCard(p) {
            const pct = getProgressPercent(p.nodes),
                cls = progressClass(pct);
            const priorityHtml = getPriorityBadgeHtml(p);
            return `<div class="kanban-card">
                <div class="card-title">${esc(getTplName(p.templateId))} <span style="font-size:11px;color:#64748b;">${esc(p.company)}</span> ${priorityHtml}</div>

                <div class="progress-bar"><div class="progress-fill ${cls}" style="width:${pct}%;"></div></div>
                <div style="font-size:11px;color:var(--text-secondary);">完成 ${pct}%</div>
                ${(p.nodes||[]).map((n,i)=>`<div class="node-row"><span>${esc(n.name)}</span><button class="node-status-btn status-${n.status||'pending'}" onclick="cycleNode('${p.id}',${i})">${n.status==='done'?'✅':n.status==='progress'?'🔄':'⏳'}</button></div>`).join('')}
                <div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;">
                  <button class="btn btn-xs btn-success" onclick="completeAllNodes('${p.id}')">✅ 完成</button>
                  <button class="btn btn-xs btn-ghost" onclick="terminateProject('${p.id}')">终止</button>
                  <button class="btn btn-xs btn-ghost" onclick="shelveProject('${p.id}')">搁置</button>
                  <button class="btn btn-xs btn-ghost" onclick="archiveProject('${p.id}')">归档</button>
                </div>
              </div>`;
        }

        function completeAllNodes(pid) {
            const p = appData.projects.find(pr => pr.id === pid);
            if (!p) return;
            const today = new Date().toISOString().split('T')[0];
            p.nodes.forEach((n, idx) => {
                n.status = 'done';
                // 同步更新关联 task，确保日历视图等基于 tasks 渲染的地方能立即反映完成状态
                const t = appData.tasks.find(task => task.projectId === pid && task.nodeIndex === idx);
                if (t) {
                    t.completed = true;
                    t.completedDate = today;
                    t.endDate = today;
                }
            });
            p.status = 'done';
            p.doneDate = today;
            saveData();
            syncSettlementsWithProjects();
            renderHome(document.getElementById('mainContent'));

        function cycleNode(pid, i) {
            const p = appData.projects.find(pr => pr.id === pid);

            // 同步更新关联 task，确保日历视图等基于 tasks 渲染的地方能立即反映状态变化
            const t = appData.tasks.find(task => task.projectId === pid && task.nodeIndex === i);
            if (t) {
                const today = new Date().toISOString().split('T')[0];
                if (n.status === 'done') {
                    t.completed = true;
                    t.completedDate = today;
                    t.endDate = today;
                } else {
                    t.completed = false;
                    t.completedDate = null;
                    t.endDate = t.dueDate || t.planDate || null;
                }
            }
            p.status = calcStatus(p.nodes);
            if (p.status === 'done') p.doneDate = new Date().toISOString().split('T')[0];
            saveData();
            syncSettlementsWithProjects();
            renderHome(document.getElementById('mainContent'));

function toggleTask(tid, chk) {
    const t = appData.tasks.find(tt => tt.id === tid);
    if (!t) return;
    t.completed = chk;
    if (chk) {
        t.completedDate = new Date().toISOString().split('T')[0];
        t.endDate = t.completedDate;
    } else {
        t.completedDate = null;
        t.endDate = t.dueDate || t.planDate || null;
    }
    if (t.projectId && t.nodeIndex !== undefined && t.nodeIndex >= 0) {
        const p = appData.projects.find(pr => pr.id === t.projectId);
        if (p && p.nodes[t.nodeIndex]) {
            const node = p.nodes[t.nodeIndex];
            node.status = chk ? 'done' : 'progress';
            p.status = calcStatus(p.nodes);
            if (p.status === 'done') p.doneDate = new Date().toISOString().split('T')[0];
            saveData(true);
            syncSettlementsWithProjects();
        }
    } else {
        saveData(true);
    }
    if (currentPage === 'calendar') {
        refreshFullCalendar();
    } else {
        renderPage(currentPage);
    }
    showToast(chk ? '✅ 任务已完成并同步' : '↩ 任务已取消完成并同步');
}

        appData.shelved.forEach(s => allProjects.push(ensureNodes({ ...s.projectData, _status: 'shelved', _shelvedAt: s.shelvedAt })));

        function saveNewProject() {
            const tid = document.getElementById('pTpl').value,
                comp = document.getElementById('pComp').value,
                tag = document.getElementById('pTag').value;
            const important = document.getElementById('pImportant').checked;
            const urgent = document.getElementById('pUrgent').checked;
            const t = appData.templates.find(tp => tp.id === tid);
            if (!t) { showAlert('模板不存在'); return; }
            // 【v21.5修复】同公司+同模板已存在时不再重复创建
            const dup = appData.projects.find(p => p.company === comp && p.templateId === tid && !p.archived && !p
                .shelved && !p.terminated);
            if (dup) { showToast('⚠️ 该公司「' + t.name + '」项目已存在，未重复创建');
                closeModal();
                renderHome(document.getElementById('mainContent'));
                return; }
            appData.projects.push({
                id: getNextId(),
                templateId: tid,
                company: comp,
                status: 'pending',
                tag: tag || t.tags[0] || '',
                important,
                urgent,
                nodes: t.nodes.map(n => ({ name: n.name, status: 'pending' })),
                doneDate: null
            });
            saveData();
            syncSettlementsWithProjects();
            closeModal();
            renderHome(document.getElementById('mainContent'));

        function onTaskPeriodChange() {
            const period = document.getElementById('taskPeriod')?.value;
            const show = period === 'custom';
            ['taskCustomStart', 'taskCustomEnd', 'taskCustomSep'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = show ? '' : 'none';
            });

        function assignFromSelection() {
            const pid = window._selPid;
            if (!pid) { showAlert('请先点击选择项目卡片'); return; }
            const selected = window._selectedNodes?.[pid] || [];
            if (selected.length === 0) { showAlert('请至少选择一个节点'); return; }
            const p = appData.projects.find(pr => pr.id === pid);
            if (!p) return;
            const period = document.getElementById('taskPeriod').value;
            const now = new Date();
            let startDate, endDate, wl = '',
                ml = '';

            if (period === 'week') {
                const day = now.getDay();
                const mon = new Date(now);
                mon.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
                const sun = new Date(mon);
                sun.setDate(mon.getDate() + 6);
                startDate = mon.toISOString().split('T')[0];
                endDate = sun.toISOString().split('T')[0];
                wl = getWeekLabel(now);
            } else if (period === 'nextWeek') {
                const nextWeek = new Date(now);
                nextWeek.setDate(now.getDate() + 7);
                const day = nextWeek.getDay();
                const mon = new Date(nextWeek);
                mon.setDate(nextWeek.getDate() - (day === 0 ? 6 : day - 1));
                const sun = new Date(mon);
                sun.setDate(mon.getDate() + 6);
                startDate = mon.toISOString().split('T')[0];
                endDate = sun.toISOString().split('T')[0];
                wl = getWeekLabel(nextWeek);
            } else if (period === 'month') {
                const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
                const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                startDate = firstDay.toISOString().split('T')[0];
                endDate = lastDay.toISOString().split('T')[0];
                ml = getMonthLabel(now);
            } else if (period === 'nextMonth') {
                const nextMonth = new Date(now);
                nextMonth.setMonth(now.getMonth() + 1);
                const firstDay = new Date(nextMonth.getFullYear(), nextMonth.getMonth(), 1);
                const lastDay = new Date(nextMonth.getFullYear(), nextMonth.getMonth() + 1, 0);
                startDate = firstDay.toISOString().split('T')[0];
                endDate = lastDay.toISOString().split('T')[0];
                ml = getMonthLabel(nextMonth);
            } else if (period === 'custom') {
                // 【v21.12】自定义开始/结束日期
                const cs = document.getElementById('taskCustomStart')?.value;
                const ce = document.getElementById('taskCustomEnd')?.value;
                if (!cs || !ce) { showAlert('请先选择自定义的开始和结束日期'); return; }
                if (cs > ce) { showAlert('开始日期不能晚于结束日期'); return; }
                startDate = cs;
                endDate = ce;
            } else {
                startDate = endDate = now.toISOString().split('T')[0];
            }

            selected.forEach(idx => {
                const node = p.nodes[idx];
                if (!node) return;
                node.status = 'progress';
                const title = `${p.company} - ${getTplName(p.templateId)} - ${node.name}`;
                appData.tasks.push({
                    id: getNextId(),
                    projectId: pid,
                    nodeIndex: idx,
                    title,
                    dueDate: endDate,
                    completed: false,
                    weekLabel: wl,
                    monthLabel: ml,
                    planDate: startDate,
                    startDate: startDate,
                    endDate: endDate,
                    completedDate: null
                });
                node.planDate = startDate;
            });
            p.status = calcStatus(p.nodes);
            saveData();
            syncSettlementsWithProjects();
            delete window._selectedNodes[pid];
            renderTasks(document.getElementById('mainContent'));
            showToast(`✅ 已为 ${p.company} 分配 ${selected.length} 个任务（${startDate} ~ ${endDate}）`);
        }

        function setTF(t, v) { if (t === 'type') window._tft = v;
            else window._tfs = v;
            renderTasks(document.getElementById('mainContent')); }

        allProjects = allProjects.filter(p => p.company.toLowerCase().includes(searchComp));
    }
    if (startDate) {
        allProjects = allProjects.filter(p => { const d = p.doneDate || ''; return d >= startDate; });
    }
    if (endDate) {
        allProjects = allProjects.filter(p => { const d = p.doneDate || ''; return d <= endDate; });
    }
    if (typeFilter && typeFilter !== 'all') {
        allProjects = allProjects.filter(p => p.templateId === typeFilter);

    appData.companies.forEach((c, i) => companyOrder[c] = i);

    appData.templates.forEach((t, i) => templateOrder[t.id] = i);

    allProjects.sort((a, b) => {
        const ca = companyOrder[a.company] ?? Infinity;
        const cb = companyOrder[b.company] ?? Infinity;
        if (ca !== cb) return ca - cb;
        const ta = templateOrder[a.templateId] ?? Infinity;
        const tb = templateOrder[b.templateId] ?? Infinity;

        function saveSettlementEdit(pid) {
            const s = appData.settlements.find(st => st.projectId === pid);
            if (!s) { showAlert('结算记录不存在'); return; }
            const newTotal = parseFloat(document.getElementById('settlementTotal').value);
            const note = document.getElementById('settlementNote')?.value || '';
            if (isNaN(newTotal) || newTotal < 0) { showAlert('请输入有效的正数金额'); return; }
            const newRatios = [];
            const installments = s.installments || [];
            let ratioSum = 0;
            for (let i = 0; i < installments.length; i++) {
                const input = document.getElementById(`installmentRatio_${i}`);
                if (input) {
                    const val = parseFloat(input.value);
                    if (isNaN(val) || val < 0) { showAlert(`第${i+1}期比例无效，请输入正数`); return; }
                    newRatios.push(val);
                    ratioSum += val;
                } else {
                    newRatios.push(installments[i].ratio);
                    ratioSum += installments[i].ratio;
                }
            }
            if (Math.abs(ratioSum - 100) > 0.01) { showAlert(`比例之和为 ${ratioSum.toFixed(1)}%，必须等于 100%`); return; }
            s.note = note;
            const ratioChanged = installments.some((inst, idx) => Math.abs(inst.ratio - newRatios[idx]) > 0.01);
            if (newTotal !== s.totalCommission || ratioChanged) {
                s.totalCommission = newTotal;
                if (newRatios.length > 0) {
                    const totalRatio = newRatios.reduce((a, b) => a + b, 0);
                    if (totalRatio > 0) {
                        s.installments = s.installments.map((inst, idx) => ({
                            ...inst,
                            ratio: newRatios[idx],
                            amount: Math.round(newTotal * newRatios[idx] / totalRatio * 100) / 100
                        }));
                    } else {
                        const avg = Math.round(newTotal / s.installments.length * 100) / 100;
                        s.installments = s.installments.map(inst => ({
                            ...inst,
                            ratio: 100 / s.installments.length,
                            amount: avg
                        }));
                    }
                }
                s.settledAmount = s.installments.filter(inst => inst.paid).reduce((sum, inst) => sum + inst.amount, 0);
                const activeInstalls = s.installments.filter(inst => inst.ratio > 0);
                s.fullySettled = activeInstalls.length > 0 && activeInstalls.every(inst => inst.paid);
            }
            s._manual = true;
            saveData();
            closeModal();
            renderSettlement(document.getElementById('mainContent'));
            showToast('✅ 结算信息已更新（已标记为手动修改）');
        }

        function initFullCalendar() {
            const container = document.getElementById('fcCalendar');
            if (!container) return;
            if (fcInstance) {
                try { $(container).fullCalendar('destroy'); } catch (e) {}
                fcInstance = null;
            }

            const viewMap = { 'month': 'month', 'week': 'basicWeek', 'day': 'basicDay' };
            const viewName = viewMap[calViewMode] || 'month';

            function getEventData(start, end, timezone, callback) {
                const events = [];
                let filteredTasks = appData.tasks || [];
                if (calFilterProject !== 'all') {
                    filteredTasks = filteredTasks.filter(t => {
                        const p = appData.projects.find(pr => pr.id === t.projectId);
                        return p && p.templateId === calFilterProject;
                    });
                }
                if (calFilterStatus !== 'all') {
                    const isDone = calFilterStatus === 'done';
                    filteredTasks = filteredTasks.filter(t => t.completed === isDone);
                }
                if (calFilterCompany) {
                    filteredTasks = filteredTasks.filter(t => {
                        const p = appData.projects.find(pr => pr.id === t.projectId);
                        return p && p.company.toLowerCase().includes(calFilterCompany.toLowerCase());
                    });
                }

                filteredTasks.forEach(t => {
                    let startDate = t.startDate || t.planDate || t.dueDate;
                    let endDate = t.endDate || t.dueDate || startDate;
                    if (!startDate) return;
                    if (t.completed) {
                        // 已完成任务：最多显示到完成日；若缺失完成日，按今天截断，避免显示到原结束日
                        const todayStr = new Date().toISOString().split('T')[0];
                        const compDate = t.completedDate || todayStr;
                        if (compDate && compDate < endDate) endDate = compDate;
                    }
                    if (startDate > endDate) { [startDate, endDate] = [endDate, startDate]; }
                    const endMoment = moment(endDate).add(1, 'days');

                    const project = appData.projects.find(p => p.id === t.projectId);
                    const tpl = project ? appData.templates.find(tm => tm.id === project.templateId) : null;
                    let color = '#3b6df0';
                    // 【v21.14】日历事件颜色轮换：按任务在总表中的全局序号取色，让相邻任务颜色不重复
                    const colors = ['#3b6df0', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6',
                        '#f97316', '#6366f1', '#22c55e'
                    ];
                    const globalIdx = appData.tasks.findIndex(tt => tt.id === t.id);
                    const colorIdx = (globalIdx >= 0 ? globalIdx : 0) % colors.length;
                    color = colors[colorIdx];
                    if (t.completed) color = adjustColorBrightness(color, 0.6);
                    const icon = getTaskIcon(t.title);

                    events.push({
                        id: t.id,
                        title: icon + ' ' + t.title,
                        start: startDate,
                        end: endMoment.format('YYYY-MM-DD'),
                        color: color,
                        textColor: '#fff',
                        className: t.completed ? 'fc-event-done' : '',
                        allDay: true,
                        projectId: t.projectId,
                        completed: t.completed
                    });
                });
                callback(events);
            }

            const _calMobile = window.innerWidth <= 768;
            $(container).fullCalendar({
                header: false,
                defaultView: viewName,
                timezone: 'local',
                allDaySlot: true,
                allDayText: '全天',
                firstDay: 1,
                height: _calMobile ? 'auto' : 'parent',
                fixedWeekCount: !_calMobile,
                eventLimit: false,
                events: getEventData,
                eventClick: function(event, jsEvent, view) {
                    const tid = event.id;
                    const task = appData.tasks.find(t => t.id === tid);
                    if (task) {
                        toggleTask(tid, !task.completed);
                        refreshFullCalendar();
                    }
                },
                eventRender: function(event, element) {
                    if (event.className) element.addClass(event.className);
                },
                viewRender: function(view, element) {
                    const label = document.getElementById('calMonthLabel');
                    if (label) label.textContent = view.title;
                    updateCalendarStats();
                },
                loading: function(isLoading) {
                    if (!isLoading) updateCalendarStats();
                }
            });

            fcInstance = container;
            setTimeout(updateCalendarStats, 100);
        }

        function refreshFullCalendar() {
            const container = document.getElementById('fcCalendar');
            if (container && $(container).fullCalendar) {
                try { $(container).fullCalendar('refetchEvents');
                    updateCalendarStats(); } catch (e) {}
            }
        }

        function updateCalendarStats() {
            const container = document.getElementById('fcCalendar');
            if (!container) return;
            try {
                const events = $(container).fullCalendar('getEvents') || [];
                const total = events.length;
                const done = events.filter(e => e.completed).length;
                const stats = document.getElementById('calStats');
                if (stats) {
                    stats.innerHTML = `
                        <span>📌 共 ${total} 个任务</span>
                        <span>✅ 已完成: ${done}</span>
                        <span>⏳ 待办: ${total - done}</span>
                        <span style="margin-left:auto;">💡 点击任务条切换完成状态</span>
                      `;
                }
            } catch (e) {}
        }

        function calNavigate(delta) {
            const container = document.getElementById('fcCalendar');
            if (container && $(container).fullCalendar) {
                try {
                    if (delta < 0) $(container).fullCalendar('prev');
                    else $(container).fullCalendar('next');
                } catch (e) {}
            }
        }

        function calToday() {
            const container = document.getElementById('fcCalendar');
            if (container && $(container).fullCalendar) {
                try { $(container).fullCalendar('today'); } catch (e) {}
            }
        }

        function setCalView(mode) {
            calViewMode = mode;
            const viewMap = { 'month': 'month', 'week': 'basicWeek', 'day': 'basicDay' };
            const viewName = viewMap[mode] || 'month';
            const container = document.getElementById('fcCalendar');
            if (container && $(container).fullCalendar) {
                try {
                    $(container).fullCalendar('changeView', viewName);
                    document.querySelectorAll('.cal-toolbar .view-group button').forEach(btn => btn.classList.remove(
                        'active'));
                    document.querySelectorAll('.cal-toolbar .view-group button').forEach(btn => {
                        const txt = btn.textContent.trim();
                        if ((mode === 'month' && txt === '月') ||
                            (mode === 'week' && txt === '周') ||
                            (mode === 'day' && txt === '日')) {
                            btn.classList.add('active');
                        }
                    });
                } catch (e) {}
            }
        }

        function calFilterChange() {
            const proj = document.getElementById('calProjectFilter');

            calFilterProject = proj ? proj.value : 'all';

        function getTaskIcon(title) {
            const lower = title.toLowerCase();
            if (lower.includes('实验')) return '🧪';
            if (lower.includes('分析')) return '📊';
            if (lower.includes('整理')) return '📂';
            if (lower.includes('绘制') || lower.includes('制图')) return '🎨';
            if (lower.includes('文献')) return '📄';
            if (lower.includes('数据')) return '📈';
            if (lower.includes('报告')) return '📝';
            if (lower.includes('会议')) return '📅';
            if (lower.includes('小鼠') || lower.includes('动物')) return '🐭';
            if (lower.includes('灌流') || lower.includes('脑片')) return '🧠';
            if (lower.includes('开颅')) return '🔬';
            if (lower.includes('病毒')) return '🧬';
            if (lower.includes('旷场')) return '🏟️';
            if (lower.includes('高架')) return '🌉';
            if (lower.includes('验收')) return '✅';
            if (lower.includes('监测')) return '📡';
            if (lower.includes('编制')) return '✍️';
            if (lower.includes('收集')) return '📥';
            if (lower.includes('填写')) return '📝';
            if (lower.includes('发送')) return '📤';
            return '📌';
        }

              <div class="template-card" data-template-id="${t.id}" style="cursor:grab;">

                <div class="template-tags">${t.tags.map(tag => `<span>${esc(tag)}</span>`).join('')}</div>
                <div class="template-actions">
                  <button class="btn btn-sm btn-primary" onclick="openTemplateModal(${i})">编辑</button>

            `).join('') || '<div class="empty-state">暂无模板</div>'}
          </div>
        </div>
      `;

    // 初始化拖拽排序
    const container = document.getElementById('templateList');
    if (container && typeof Sortable !== 'undefined') {
        if (window._templateSortable) {
            window._templateSortable.destroy();
        }
        window._templateSortable = new Sortable(container, {
            animation: 150,
            handle: '.template-card',
            onEnd: function(evt) {
                const items = container.querySelectorAll('.template-card');
                const newOrder = [];
                items.forEach(el => {
                    const id = el.getAttribute('data-template-id');
                    if (id) newOrder.push(id);
                });
                if (newOrder.length > 0) {
                    // 根据新顺序重新排列 appData.templates
                    const reordered = [];
                    newOrder.forEach(id => {
                        const found = appData.templates.find(t => t.id === id);
                        if (found) reordered.push(found);
                    });
                    // 补充可能遗漏的
                    appData.templates.forEach(t => {
                        if (!reordered.find(rt => rt.id === t.id)) {
                            reordered.push(t);
                        }
                    });
                    appData.templates = reordered;
                    saveData(true); // 强制上传
                    showToast('✅ 模板顺序已更新并同步');
                }
            }
        });
    }
}

        // ============================================================
        // 报告模板（完整，含自动生成内容）

function generateReportContent(type, fieldName) {
    const now = new Date();
    const today = now.toISOString().split('T')[0];
    const activeProjects = appData.projects.filter(p => !p.archived && !p.shelved && !p.terminated);
    const allTasks = appData.tasks || [];
    const day = now.getDay();
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);
    const weekStartStr = weekStart.toISOString().split('T')[0];
    const weekEndStr = weekEnd.toISOString().split('T')[0];
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    const monthStartStr = monthStart.toISOString().split('T')[0];
    const monthEndStr = monthEnd.toISOString().split('T')[0];
    const nextWeekStart = new Date(weekStart);
    nextWeekStart.setDate(weekStart.getDate() + 7);
    const nextWeekEnd = new Date(nextWeekStart);
    nextWeekEnd.setDate(nextWeekStart.getDate() + 6);
    const nextWeekStartStr = nextWeekStart.toISOString().split('T')[0];
    const nextWeekEndStr = nextWeekEnd.toISOString().split('T')[0];
    const nextMonthStart = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const nextMonthEnd = new Date(now.getFullYear(), now.getMonth() + 2, 0);
    const nextMonthStartStr = nextMonthStart.toISOString().split('T')[0];
    const nextMonthEndStr = nextMonthEnd.toISOString().split('T')[0];
    const field = fieldName.toLowerCase();

    // === 新增：工作日志字段 ===
    if (field.includes('日志') || field.includes('工作记录')) {
        let logs = appData.workLogs || [];
        if (type === 'weekly') {
            logs = logs.filter(l => l.date >= weekStartStr && l.date <= weekEndStr);
        } else {
            logs = logs.filter(l => l.date >= monthStartStr && l.date <= monthEndStr);
        }
        if (logs.length === 0) return '本周/本月暂无工作日志。';
        const logLines = logs.map(l => {
            const projName = l.projectId ? getProjectName(l.projectId) : '无关联';
            return `• [${l.date}] ${projName}：${l.content}`;
        }).join('\n');
        return `工作日志（共 ${logs.length} 条）：\n${logLines}`;
    }

    // ---- 项目概况 ----
    if (field.includes('项目') && (field.includes('概况') || field.includes('统计') || field.includes('总览'))) {
        const total = activeProjects.length;
        const done = activeProjects.filter(p => calcStatus(p.nodes) === 'done').length;
        const progress = activeProjects.filter(p => calcStatus(p.nodes) === 'progress').length;
        const pending = activeProjects.filter(p => calcStatus(p.nodes) === 'pending').length;
        const archived = appData.archived.length;
        const shelved = appData.shelved.length;
        const terminated = appData.terminated.length;
        // 按类型统计
        const typeStats = {};
        activeProjects.forEach(p => {
            const tpl = appData.templates.find(t => t.id === p.templateId);
            const name = tpl ? tpl.name : '其他';
            if (!typeStats[name]) typeStats[name] = 0;
            typeStats[name]++;
        });
        const typeStr = Object.keys(typeStats).map(k => `${k}${typeStats[k]}`).join('、');
        const doneProjects = activeProjects.filter(p => calcStatus(p.nodes) === 'done');
        const doneList = doneProjects.map(p => {
            const tpl = appData.templates.find(t => t.id === p.templateId);
            return `${p.company}（${tpl ? tpl.name : '未知'}）`;
        }).join('；');
        return `当前共有 ${total} 个活跃项目。其中 ${typeStr}。\n已完成项目（${done}个）：${doneList || '无'}\n进行中：${progress} 个，未开始：${pending} 个。\n归档 ${archived} 个，搁置 ${shelved} 个，终止 ${terminated} 个。`;
    }

    // ---- 本周工作内容 ----
    if (field.includes('本周') && (field.includes('工作') || field.includes('内容') || field.includes('任务'))) {
        const weekTasks = allTasks.filter(t => {
            const due = t.dueDate || t.planDate || t.startDate;
            return due && due >= weekStartStr && due <= weekEndStr;
        });
        if (weekTasks.length === 0) return '本周暂无工作记录。';
        const doneWeek = weekTasks.filter(t => t.completed).length;
        const taskList = weekTasks.map(t => {
            const p = appData.projects.find(pr => pr.id === t.projectId);
            const projName = p ? `${p.company}` : '未知项目';
            return `• ${t.title}${t.completed ? '✅' : '⏳'}`;
        }).join('\n');
        return `本周（${weekStartStr} ~ ${weekEndStr}）共 ${weekTasks.length} 个任务，已完成 ${doneWeek} 个。\n${taskList}`;
    }

    // ---- 完成进度 ----
    if (field.includes('进度') || field.includes('完成') || field.includes('达成')) {
        const total = activeProjects.length;
        const done = activeProjects.filter(p => calcStatus(p.nodes) === 'done').length;
        const progressProjects = activeProjects.filter(p => calcStatus(p.nodes) === 'progress');
        const pending = activeProjects.filter(p => calcStatus(p.nodes) === 'pending');
        const overallPct = total === 0 ? 0 : Math.round(done / total * 100);
        const allProj = activeProjects.map(p => {
            const pct = getProgressPercent(p.nodes);
            const tpl = appData.templates.find(t => t.id === p.templateId);
            const doneNodes = p.nodes.filter(n => n.status === 'done').length;
            const totalNodes = p.nodes.length;
            return `${p.company}（${tpl ? tpl.name : '未知'}）完成${pct}%（${doneNodes}/${totalNodes}个节点）`;
        }).join('；');
        return `总体进度：${overallPct}%（已完成 ${done}/${total}）\n进行中：${progressProjects.length} 个，未开始：${pending.length} 个。\n各项目详情：${allProj}`;
    }

    // ---- 下周计划 ----
    if (field.includes('下周') && (field.includes('计划') || field.includes('安排') || field.includes('任务'))) {
        const nextWeekTasks = allTasks.filter(t => {
            const due = t.dueDate || t.planDate || t.startDate;
            return due && due >= nextWeekStartStr && due <= nextWeekEndStr;
        });
        if (nextWeekTasks.length === 0) return '下周暂无计划任务。';
        const taskList = nextWeekTasks.map(t => {
            const p = appData.projects.find(pr => pr.id === t.projectId);
            const projName = p ? `${p.company}（${getTplName(p.templateId)}）` : '未知项目';
            return `• ${t.title}（${projName}）`;
        }).join('\n');
        return `下周（${nextWeekStartStr} ~ ${nextWeekEndStr}）计划 ${nextWeekTasks.length} 个任务：\n${taskList}`;
    }

    // ---- 存在问题 ----
    if (field.includes('问题') || field.includes('风险') || field.includes('阻碍') || field.includes('逾期')) {
        const overdueTasks = allTasks.filter(t => {
            if (t.completed) return false;
            const due = t.dueDate || t.planDate || t.startDate;
            return due && due < today;
        });
        const pendingTasks = allTasks.filter(t => !t.completed);
        if (overdueTasks.length === 0 && pendingTasks.length === 0) return '✅ 目前无逾期任务，一切正常。';
        let msg = '';
        if (overdueTasks.length > 0) {
            msg += `⚠️ 逾期任务（${overdueTasks.length} 个）：\n`;
            msg += overdueTasks.map(t => {
                const p = appData.projects.find(pr => pr.id === t.projectId);
                const projName = p ? `${p.company}（${getTplName(p.templateId)}）` : '未知项目';
                return `• ${t.title}（${projName}，截止 ${t.dueDate || t.planDate}）`;
            }).join('\n');
        }
        if (pendingTasks.length > 0 && overdueTasks.length === 0) {
            msg = `⏳ 待办任务 ${pendingTasks.length} 个，暂无逾期。`;
        } else if (pendingTasks.length > 0 && overdueTasks.length > 0) {
            msg += `\n⏳ 另有 ${pendingTasks.length} 个待办任务待处理。`;
        }
        return msg;
    }

    // ---- 本月工作 ----
    if (field.includes('本月') && (field.includes('工作') || field.includes('内容') || field.includes('任务'))) {
        const monthTasks = allTasks.filter(t => {
            const due = t.dueDate || t.planDate || t.startDate;
            return due && due >= monthStartStr && due <= monthEndStr;
        });
        if (monthTasks.length === 0) return '本月暂无任务记录。';
        const doneMonth = monthTasks.filter(t => t.completed).length;
        const taskList = monthTasks.map(t => {
            const p = appData.projects.find(pr => pr.id === t.projectId);
            const projName = p ? `${p.company}` : '未知项目';
            return `• ${t.title}${t.completed ? '✅' : '⏳'}`;
        }).join('\n');
        return `本月（${monthStartStr} ~ ${monthEndStr}）共 ${monthTasks.length} 个任务，已完成 ${doneMonth} 个。\n${taskList}`;
    }

    // ---- 下月计划 ----
    if (field.includes('下月') && (field.includes('计划') || field.includes('安排'))) {
        const nextMonthTasks = allTasks.filter(t => {
            const due = t.dueDate || t.planDate || t.startDate;
            return due && due >= nextMonthStartStr && due <= nextMonthEndStr;
        });
        if (nextMonthTasks.length === 0) return '下月暂无计划。';
        const taskList = nextMonthTasks.map(t => {
            const p = appData.projects.find(pr => pr.id === t.projectId);
            const projName = p ? `${p.company}（${getTplName(p.templateId)}）` : '未知项目';
            return `• ${t.title}（${projName}）`;
        }).join('\n');
        return `下月（${nextMonthStartStr} ~ ${nextMonthEndStr}）计划 ${nextMonthTasks.length} 个任务：\n${taskList}`;
    }

    // 默认
    const total = activeProjects.length;
    const totalTasks = allTasks.length;
    const doneTasks = allTasks.filter(t => t.completed).length;
    return `📌 ${fieldName}\n• 当前时间：${now.toLocaleString('zh-CN')}\n• 项目总数：${total} 个\n• 任务总数：${totalTasks} 个（已完成 ${doneTasks} 个）\n💡 可在此编辑补充。`;
}

        return `${y}-${m}-${dd}`;
    };
    const reportPeriod = type === 'weekly'

        : `${formatDate(monthStart)} ~ ${formatDate(monthEnd)}`;

// 保存当前报告为历史快照
function saveReportSnapshot() {
    const type = window._reportType || 'weekly';
    const fields = appData.reportTemplates[type] || [];
    if (fields.length === 0) {
        showAlert('请先添加字段再保存报告');
        return;
    }

    const preview = document.getElementById('reportPreviewContent');
    if (!preview) {
        showAlert('预览区域未加载');
        return;
    }

    const fieldContents = {};
    preview.querySelectorAll('.field-content').forEach(el => {
        const field = el.dataset.field;
        if (field) {
            fieldContents[field] = el.innerHTML;
        }
    });

    const now = new Date();
    const day = now.getDay();
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    const formatDate = (d) => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${dd}`;
    };
    const reportPeriod = type === 'weekly' 
        ? `${formatDate(weekStart)} ~ ${formatDate(weekEnd)}`
        : `${formatDate(monthStart)} ~ ${formatDate(monthEnd)}`;
    const reportTitle = type === 'weekly' ? '环境咨询周报' : '环境咨询月报';

    const snapshot = {
        id: 'hist_' + Date.now(),
        type: type,
        title: reportTitle,
        period: reportPeriod,
        generatedAt: now.toISOString(),
        fields: fields.map(f => ({
            name: f,
            content: fieldContents[f] || ''
        })),
        rawContents: { ...fieldContents }
    };

    if (!appData.reportHistory) appData.reportHistory = [];
    appData.reportHistory.unshift(snapshot);
    saveData();
    showToast('✅ 报告已保存至历史记录');
}

        async function testSupabaseConnection() {
            const url = document.getElementById('supabaseUrl').value.trim();
            const anonKey = document.getElementById('supabaseAnonKey').value.trim();
            if (!url || !anonKey) { showAlert('请完整填写 URL 和 Anon Key'); return; }
            const cleanUrl = url.replace(/\/+$/, '');
            document.getElementById('supabaseUrl').value = cleanUrl;
            const statusMsg = document.getElementById('cloudStatusMsg');
            statusMsg.textContent = '⏳ 正在测试连接...';
            try {
                const client = window.supabase.createClient(cleanUrl, anonKey);
                const { data, error, status } = await client.from('companies').select('*').limit(1);
                if (error) {
                    let detail = error.message;
                    if (error.code === 'PGRST301') detail = '表 "companies" 不存在，请先在 SQL Editor 中执行建表语句。';
                    else if (error.code === '42501') detail = '权限不足，请检查 RLS 策略是否允许匿名访问，并为表授予 insert/select/delete 权限。';
                    else if (error.message.includes('JWT')) detail =
                        'Anon Key 无效，请从 Settings → API 中复制正确的 anon public 密钥。';
                    statusMsg.textContent = `❌ 连接失败: ${detail} (状态码: ${status})`;
                    showAlert(`连接失败: ${detail}\n请检查 URL、Key 以及表是否存在。`);
                    return;
                }
                // 检查版本快照表是否存在
                let snapshotMsg = '';
                try {
                    const { error: snapErr } = await client.from('snapshots').select('count', { count: 'exact', head: true });
                    if (snapErr) {
                        if (snapErr.code === 'PGRST301' || (snapErr.message && snapErr.message.includes('snapshots') && snapErr.message.includes('does not exist'))) {
                            snapshotMsg = ' ⚠️ 版本快照表 "snapshots" 不存在，上传时不会创建版本历史。请按下方 SQL 创建该表。';
                        } else if (snapErr.code === '42501' || (snapErr.message && snapErr.message.includes('permission denied'))) {
                            snapshotMsg = ' ⚠️ 版本快照表 "snapshots" 权限不足。请在 Supabase SQL Editor 中执行下方“含 grant 语句”的建表 SQL。';
                        } else {
                            snapshotMsg = ' ⚠️ 版本快照表访问异常: ' + snapErr.message;
                        }
                    } else {
                        snapshotMsg = ' ✅ 版本快照表 "snapshots" 可访问。';
                    }
                } catch (snapErr) {
                    snapshotMsg = ' ⚠️ 版本快照表检测失败。';
                }
                statusMsg.textContent = '✅ 连接成功！表 "companies" 可访问。' + snapshotMsg;
                showToast('✅ 连接成功！');
                if (!supabaseClient) {
                    saveSupabaseConfig(cleanUrl, anonKey);
                    initSupabase();
                }
            } catch (err) {
                let msg = err.message;
                if (err.message.includes('Failed to fetch')) msg =
                    '网络请求失败，请检查 Supabase URL 是否正确，或是否启用 CORS（建议使用本地服务器打开页面）。';
                statusMsg.textContent = `❌ 连接异常: ${msg}`;
                showAlert('连接异常: ' + msg);
            }
        }

        function reconcileCompaniesFromProjects() {
            // 【v21.7】从所有项目（含归档/搁置/终止）里搜集公司名，确保 appData.companies 都列出它们。
            // 修复：批量导入只推项目、不登记公司 → 公司成"幽灵"，总表看不到却判"已存在"。
            // 返回本次新补的公司数，便于调用方决定是否保存。
            if (!Array.isArray(appData.companies)) appData.companies = [];
            const missing = [];
            const add = (name) => {
                if (name && !appData.companies.includes(name) && !missing.includes(name)) missing.push(name);
            };
            (appData.projects || []).forEach(p => add(p.company));
            (appData.archived || []).forEach(a => add((a.projectData || {}).company));
            (appData.shelved || []).forEach(s => add((s.projectData || {}).company));
            (appData.terminated || []).forEach(t => add((t.projectData || {}).company));
            if (missing.length) appData.companies = appData.companies.concat(missing);
            return missing.length;
        }

        function executeBatchImport() {
            const input = document.getElementById('batchInput');
            const lines = input.value.split('\n').filter(l => l.trim());
            let imported = 0,
                errors = [],
                results = [];
            const templateMap = {};
            appData.templates.forEach(t => templateMap[t.name] = t);
            lines.forEach((line, idx) => {
                const parts = line.split(',').map(s => s.trim());
                if (parts.length < 2) { errors.push(`第${idx+1}行: 格式错误`); return; }
                const [comp, tplName, tag] = parts;
                if (!comp || !tplName) { errors.push(`第${idx+1}行: 公司或模板为空`); return; }
                const tpl = templateMap[tplName];
                if (!tpl) { errors.push(`第${idx+1}行: 模板「${tplName}」不存在`); return; }
                if (tag && tpl.tags && !tpl.tags.includes(tag)) { errors.push(`第${idx+1}行: 标签「${tag}」无效`); return; }
                const exist = appData.projects.find(p => p.company === comp && p.templateId === tpl.id);
                if (exist) { errors.push(`第${idx+1}行: ${comp}的「${tplName}」已存在`); return; }
                appData.projects.push({
                    id: getNextId(),
                    templateId: tpl.id,
                    company: comp,
                    status: 'pending',
                    tag: tag || tpl.tags[0] || '',
                    important: false,
                    urgent: false,
                    nodes: tpl.nodes.map(n => ({ name: n.name, status: 'pending' })),
                    doneDate: null
                });
                // 【v21.7】批量导入必须登记公司，否则总表不显示该公司行
                if (!appData.companies.includes(comp)) appData.companies.push(comp);
                imported++;
                results.push(`✅ ${comp} - ${tplName}${tag ? ' (' + tag + ')' : ''}`);
            });
            if (imported > 0 || reconcileCompaniesFromProjects() > 0) {
                saveData();
                renderProjects(document.getElementById('mainContent'));
            }
            document.getElementById('batchResult').textContent =
                `成功导入 ${imported} 项\n${results.join('\n')}\n${errors.length ? '\n错误:\n' + errors.join('\n') : ''}`;
            if (imported > 0) showToast(`成功导入 ${imported} 个项目`);
            else showToast('导入失败，请检查数据', true);
        }

        function toggleMProjType(comp, tid, el) {

        function toggleProject(comp, tid, chk) {
            if (chk) {
                const tpl = appData.templates.find(t => t.id === tid);
                if (!tpl) { showAlert('模板不存在'); return; }
                // 【v21.5修复】防重复：同公司 + 同模板 的活动项目已存在时，不再创建第二个
                const existing = appData.projects.find(pr => pr.company === comp && pr.templateId === tid && !pr
                    .archived && !pr.shelved && !pr.terminated);
                if (existing) {
                    showToast('⚠️ 该公司「' + getTplName(tid) + '」项目已存在，未重复创建');
                    renderProjects(document.getElementById('mainContent'));
                    return;
                }
                appData.projects.push({
                    id: getNextId(),
                    templateId: tid,
                    company: comp,
                    status: 'pending',
                    tag: tpl.tags[0] || '',
                    important: false,
                    urgent: false,
                    nodes: tpl.nodes.map(n => ({ name: n.name, status: 'pending' })),
                    doneDate: null
                });
            } else {
                const p = appData.projects.find(pr => pr.company === comp && pr.templateId === tid && !pr.archived && !
                    pr.shelved && !pr.terminated);
                if (p) {
                    // 【v21.5修复】记录“墓碑”：上传时从云端精确删除该项目及其子记录，避免“取消后重新创建又出现2个重复”
                    if (!appData._deletedProjectIds) appData._deletedProjectIds = [];
                    if (appData._deletedProjectIds.indexOf(p.id) === -1) appData._deletedProjectIds.push(p.id);
                    appData.projects = appData.projects.filter(pr => pr.id !== p.id);
                    appData.tasks = appData.tasks.filter(t => t.projectId !== p.id);
                    appData.settlements = appData.settlements.filter(s => s.projectId !== p.id);
                }
            }
            saveData();
            syncSettlementsWithProjects();
            renderProjects(document.getElementById('mainContent'));
        }

        function updateTag(comp, tid, val) {
            const p = appData.projects.find(pr => pr.company === comp && pr.templateId === tid && !pr.archived && !pr
                .shelved && !pr.terminated);
            if (p) { p.tag = val;
                saveData();
                syncSettlementsWithProjects(); }
        }
